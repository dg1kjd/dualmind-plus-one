<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualMind+1 — MoshiPlex Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            text-align: left;
            padding: 20px 0;
            border-bottom: 1px solid rgba(118, 185, 0, 0.3);
            margin-bottom: 20px;
            min-height: 110px;
        }

        .brand-logo {
            height: 90px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .logo-link {
            display: inline-flex;
            align-items: center;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #76b900, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #76b900;
            box-shadow: 0 0 10px #76b900;
        }

        .status-dot.connecting {
            background: #ffaa00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .conference-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex: 1;
        }

        .persona-panel {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .persona-panel.persona-disabled {
            opacity: 0.6;
        }

        .persona-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .persona-panel.left::before {
            background: linear-gradient(90deg, #76b900, transparent);
        }

        .persona-panel.right::before {
            background: linear-gradient(90deg, transparent, #00d4ff);
        }

        .persona-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .persona-name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .persona-panel.left .persona-name {
            color: #76b900;
        }

        .persona-panel.right .persona-name {
            color: #00d4ff;
        }

        .visualizer-container {
            height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .visualizer {
            width: 100%;
            height: 100%;
        }

        .config-section {
            margin-bottom: 20px;
        }

        .config-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .config-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: rgba(118, 185, 0, 0.5);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .text-display {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 200px;
            max-height: 300px;
        }

        .text-display.left {
            border-left: 3px solid #76b900;
        }

        .text-display.right {
            border-left: 3px solid #00d4ff;
        }

        .text-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: currentColor;
            animation: blink 1s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 25px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #76b900, #5a8f00);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(118, 185, 0, 0.3);
        }

        .btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }

        .user-section {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-section h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #888;
        }

        .mic-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mic-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .mic-icon.active {
            background: rgba(118, 185, 0, 0.3);
            box-shadow: 0 0 20px rgba(118, 185, 0, 0.5);
        }

        .mic-visualizer-container {
            height: 80px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .mic-visualizer {
            width: 100%;
            height: 100%;
        }


        .stats-pane {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px 20px;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #76b900;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 4px 10px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: none;
            letter-spacing: 0;
        }

        .preset-btn:hover {
            background: rgba(118, 185, 0, 0.2);
            border-color: #76b900;
            color: #fff;
        }

        .preset-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.1);
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(255,255,255,0.05);
        }

        .btn-secondary:disabled:hover {
            background: rgba(255,255,255,0.05);
            transform: none;
        }

        @media (max-width: 1200px) {
            .conference-grid {
                grid-template-columns: 1fr;
            }
            header {
                flex-direction: column;
                align-items: flex-start;
                min-height: unset;
            }
            .brand-logo {
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="https://www.jens-david-consulting.com" class="logo-link" target="_blank" rel="noreferrer noopener">
                <img src="jdc.png" alt="Jens David Consulting" class="brand-logo">
            </a>
            <div class="header-text">
                <h1>DualMind + 1</h1>
                <div class="subtitle">MoshiPlex Edition — Autonomous AI Dialogue Showcase</div>
            </div>
        </header>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="connectionStatus"></div>
                <span id="connectionText">Disconnected</span>
            </div>
        </div>

        <div class="conference-grid">
            <!-- Left Panel - AI Mind A -->
            <div class="persona-panel left" data-persona-panel="A">
                <div class="persona-header">
                    <span class="persona-name">AI Mind A</span>
                </div>
                
                <div class="visualizer-container">
                    <canvas class="visualizer" id="visualizerA"></canvas>
                </div>

                <div class="config-section">
                    <div class="config-row">
                        <div class="config-group">
                            <label>Voice</label>
                            <select id="voiceA">
                                <option value="NATF1.pt">Sophia</option>
                                <option value="NATF2.pt">Elena</option>
                                <option value="NATF3.pt">Maya</option>
                                <option value="NATM1.pt">Marcus</option>
                                <option value="NATM2.pt">James</option>
                                <option value="NATM3.pt">Oliver</option>
                                <option value="__disabled__">None / Disabled</option>
                            </select>
                        </div>
                    </div>
                    <div class="config-group">
                        <label>Personality Presets</label>
                        <div class="preset-buttons" data-persona-buttons="A">
                            <button class="preset-btn" onclick="setPreset('A', 'philosopher')">🤔 Philosopher</button>
                            <button class="preset-btn" onclick="setPreset('A', 'comedian')">😄 Comedian</button>
                            <button class="preset-btn" onclick="setPreset('A', 'detective')">🚔 Police Detective</button>
                            <button class="preset-btn" onclick="setPreset('A', 'robber')">🍬 Candy Robber</button>
                            <button class="preset-btn" onclick="setPreset('A', 'poet')">✨ Poet</button>
                            <button class="preset-btn" onclick="setPreset('A', 'mlengineer')">🤖 ML Engineer</button>
                            <button class="preset-btn" onclick="setPreset('A', 'psychologist')">🧠 Psychologist</button>
                        </div>
                        <label>System Prompt</label>
                        <textarea id="promptA">You enjoy having a good conversation. You are curious and ask thoughtful questions.</textarea>
                    </div>
                </div>

                <div class="text-display left" id="textA">
                    <span class="text-cursor"></span>
                </div>
            </div>

            <!-- Right Panel - AI Mind B -->
            <div class="persona-panel right" data-persona-panel="B">
                <div class="persona-header">
                    <span class="persona-name">AI Mind B</span>
                </div>
                
                <div class="visualizer-container">
                    <canvas class="visualizer" id="visualizerB"></canvas>
                </div>

                <div class="config-section">
                    <div class="config-row">
                        <div class="config-group">
                            <label>Voice</label>
                            <select id="voiceB">
                                <option value="NATM1.pt">Marcus</option>
                                <option value="NATM2.pt">James</option>
                                <option value="NATM3.pt">Oliver</option>
                                <option value="NATF1.pt">Sophia</option>
                                <option value="NATF2.pt">Elena</option>
                                <option value="NATF3.pt">Maya</option>
                                <option value="__disabled__">None / Disabled</option>
                            </select>
                        </div>
                    </div>
                    <div class="config-group">
                        <label>Personality Presets</label>
                        <div class="preset-buttons" data-persona-buttons="B">
                            <button class="preset-btn" onclick="setPreset('B', 'philosopher')">🤔 Philosopher</button>
                            <button class="preset-btn" onclick="setPreset('B', 'comedian')">😄 Comedian</button>
                            <button class="preset-btn" onclick="setPreset('B', 'detective')">🚔 Police Detective</button>
                            <button class="preset-btn" onclick="setPreset('B', 'robber')">🍬 Candy Robber</button>
                            <button class="preset-btn" onclick="setPreset('B', 'poet')">✨ Poet</button>
                            <button class="preset-btn" onclick="setPreset('B', 'mlengineer')">🤖 ML Engineer</button>
                            <button class="preset-btn" onclick="setPreset('B', 'psychologist')">🧠 Psychologist</button>
                        </div>
                        <label>System Prompt</label>
                        <textarea id="promptB">You enjoy having a good conversation. You share interesting stories and perspectives.</textarea>
                    </div>
                </div>

                <div class="text-display right" id="textB">
                    <span class="text-cursor"></span>
                </div>
            </div>
        </div>

        <div class="user-section">
            <h3>Your Microphone</h3>
            <div class="mic-visualizer-container">
                <canvas class="mic-visualizer" id="visualizerMic"></canvas>
            </div>
            
            <div class="stats-pane">
                <div class="stat-item">
                    <div class="stat-value" id="statTime">00:00</div>
                    <div class="stat-label">Session Time</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statLevelA">--- dBFS</div>
                    <div class="stat-label">Mind A Level</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statLevelB">--- dBFS</div>
                    <div class="stat-label">Mind B Level</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statLatency">--</div>
                    <div class="stat-label">Latency (ms)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statFrames">0</div>
                    <div class="stat-label">Frames</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statDropped">0</div>
                    <div class="stat-label">Dropped</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn">Start Conference</button>
            <button class="btn-danger" id="stopBtn" style="display: none;">End Conference</button>
            <button class="btn-secondary" id="clearBtn">Clear Text</button>
            <button class="btn-secondary" id="downloadBtn" disabled>Download Recording</button>
        </div>
    </div>

    <script src="recorder.min.js"></script>
    <script src="conference.js"></script>
</body>
</html>
